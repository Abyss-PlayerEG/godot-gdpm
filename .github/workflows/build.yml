# Build Executables —— 发布三端（四矩阵）二进制
#
# 触发：release 发布（或手动 workflow_dispatch 演练）。
# 流水线：tag 校验 → build.py 构建归档 → smoke.py 冒烟 → 上传 artifact
#        → 汇总生成 sha256 → （仅 release 事件）挂到 Release 附件。
# 关键设计：冒烟卡在上传之前 —— 坏归档永远成不了发布附件。
name: Build Executables

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # 仅 upload job 需要（挂附件）；最小权限声明

jobs:
  build:
    strategy:
      matrix:
        include:
          # 两个 Ubuntu 版本各出一份：二进制绑定构建机 glibc，
          # 22.04 产物兼容更老的发行版，24.04 产物适配新发行版
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
            suffix: ubuntu2204 # 与 build.py 解析 /etc/os-release 的结果一致
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
            suffix: ubuntu2404
          # macOS 当前 runner 即 arm64；Windows 仅 amd64（无签名校验，见 docs）
          - os: macos-latest
            platform: macos
            arch: arm64
            suffix: ""
          - os: windows-latest
            platform: windows
            arch: amd64
            suffix: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      # uv 依赖缓存：三个路径覆盖 Linux/macOS/Windows 的 uv 缓存位置
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/Library/Caches/uv
            ~\AppData\Local\uv\Cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync

      # tag == pyproject 版本校验：防"忘跑 version.py 就打 release"。
      # PyPI 版本不可覆盖、归档名也带 tag，不一致必须当场失败。
      # 仅 release 事件执行（手动 dispatch 时 GITHUB_REF_NAME 是分支名，跳过）。
      - name: Verify release tag matches pyproject version
        if: github.event_name == 'release'
        run: |
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "  release tag: ${GITHUB_REF_NAME}"
          echo "  pyproject:   v${VER}"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag/version mismatch — run scripts/version.py, commit, then re-release."
            exit 1
          fi

      # 构建 + 打归档（PyInstaller onedir + 拷安装脚本），本地同款命令：
      #   uv run python scripts/build.py --tag vX.Y.Z
      - name: Build executable
        run: uv run python scripts/build.py --tag "${{ github.event.release.tag_name || 'dev' }}"

      # 冒烟：解压归档跑 --version/--help/--completion、断言执行位
      # （等价于本地 python3 scripts/smoke.py --scripts）；不通过则后续步骤不会执行
      # --scripts: Windows 腿额外真跑 install→uninstall 往返（PATH 快照→写入→移除→逐字还原）
      - name: Smoke test archive
        run: uv run python scripts/smoke.py --scripts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdpm-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.suffix || 'default' }}
          path: dist/gdpm_*

  # 汇总作业：下载四条腿的全部产物，统一生成 sha256 校验清单
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -name "gdpm_*" -exec sha256sum {} \; > ../checksums.txt
          cd ..
          cat checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.txt

  # 发布作业：把归档 + 校验清单挂到 Release 资产。
  # 仅 release 事件（手动 dispatch 只留 artifact 供检查，不发附件）。
  upload:
    needs: [build, checksums]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/gdpm_*
            artifacts/checksums/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
