name: Build Executables

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
            suffix: ubuntu2204
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
            suffix: ubuntu2404
          - os: macos-latest
            platform: macos
            arch: arm64
            suffix: ""
          - os: windows-latest
            platform: windows
            arch: amd64
            suffix: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/Library/Caches/uv
            ~\AppData\Local\uv\Cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync

      - name: Verify release tag matches pyproject version
        if: github.event_name == 'release'
        run: |
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "  release tag: ${GITHUB_REF_NAME}"
          echo "  pyproject:   v${VER}"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag/version mismatch — run scripts/version.py, commit, then re-release."
            exit 1
          fi

      - name: Build executable
        run: uv run python scripts/build.py --tag "${{ github.event.release.tag_name || 'dev' }}"

      - name: Smoke test archive
        run: uv run python scripts/smoke.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdpm-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.suffix || 'default' }}
          path: dist/gdpm_*

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -name "gdpm_*" -exec sha256sum {} \; > ../checksums.txt
          cd ..
          cat checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.txt

  upload:
    needs: [build, checksums]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/gdpm_*
            artifacts/checksums/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
