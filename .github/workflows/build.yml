# Build Executables —— 发布三端（四矩阵）二进制
#
# 触发：release 发布（或手动 workflow_dispatch 演练）。
# 流水线：tag 校验 → build.py 构建归档 → smoke.py 冒烟 → 上传 artifact
#        → 汇总生成 sha256 → （仅 release 事件）挂到 Release 附件。
# 关键设计：冒烟卡在上传之前 —— 坏归档永远成不了发布附件。
name: Build Executables

on:
  release:
    types: [published]
  workflow_dispatch:

# 默认只读；upload job 单独申请 write（挂附件）——权限按 job 下沉，
# 避免 build/checksums 白拿写权限（它们会执行依赖代码）。
permissions:
  contents: read

jobs:
  # 门禁（阶段1）：发版前先过全部 8 项质量检查。
  # build.yml 与 publish.yml 由同一 release 事件独立触发、互不依赖 —— 没有这道闸时，
  # 门禁失败会出现"publish 挂了、PyPI 空着，build 却照样把 4 平台二进制挂上 Release"
  # 的半成品交付。Godot 有 static-checks、uv 有 release-gate，此处同理。
  # 失败后果：build 被跳过 → Release 无附件，一眼看出发版失败。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
          lookup-only: true # 发版工作流只读 CI 填的缓存，不回写

      - name: Install dependencies
        run: uv sync

      - name: Run all checks
        run: python3 scripts/check.py

  build:
    needs: gate
    strategy:
      # 发布构建需要 4 腿全绿，让每条腿都跑完——一条失败不再连坐取消
      # 其余（含排队中）的腿，一次运行就能看全所有平台的失败，
      # 不用"修一个 → 重跑 → 才发现下一个"地串行排错。
      fail-fast: false
      matrix:
        include:
          # 两个 Ubuntu 版本各出一份：二进制绑定构建机 glibc，
          # 22.04 产物兼容更老的发行版，24.04 产物适配新发行版
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
            suffix: ubuntu2204 # 与 build.py 解析 /etc/os-release 的结果一致
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
            suffix: ubuntu2404
          # macOS 当前 runner 即 arm64；Windows 仅 amd64（无签名校验，见 docs）
          - os: macos-latest
            platform: macos
            arch: arm64
            suffix: ""
          - os: windows-latest
            platform: windows
            arch: amd64
            suffix: ""

    runs-on: ${{ matrix.os }}
    # 单腿挂死时自动止损（历史上 macos-13 曾挂 12 分钟，卡住
    # checksums/upload 直到人工取消）。计时从拿到 runner 开始，
    # 排队等待不计入，不会因 macOS 容器排队久而误超时。
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # 构建会执行依赖代码，token 不留在 .git/config

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      # uv 依赖缓存：三个路径覆盖 Linux/macOS/Windows 的 uv 缓存位置
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/Library/Caches/uv
            ~\AppData\Local\uv\Cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
          # 发版工作流只读 CI 填的缓存、不回写——否则可能成为缓存投毒源
          lookup-only: true

      - name: Install dependencies
        run: uv sync

      # tag == pyproject 版本校验：防"忘跑 version.py 就打 release"。
      # PyPI 版本不可覆盖、归档名也带 tag，不一致必须当场失败。
      # 仅 release 事件执行（手动 dispatch 时 GITHUB_REF_NAME 是分支名，跳过）。
      - name: Verify release tag matches pyproject version
        if: github.event_name == 'release'
        # Windows runner 默认 pwsh, 本步骤是 bash 脚本 (${VAR#...} / if [ ] 在
        # pwsh 下 ParserError) —— 与下方 Build executable 同因。
        shell: bash
        run: |
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "  release tag: ${GITHUB_REF_NAME}"
          echo "  pyproject:   v${VER}"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag/version mismatch — run scripts/version.py, commit, then re-release."
            exit 1
          fi

      # 构建 + 打归档（PyInstaller onedir + 拷安装脚本），本地同款命令：
      #   uv run python scripts/build.py --tag vX.Y.Z
      # 归档名 = gdpm_{tag}_{plat}_{arch}[_{distro}]：release 事件用真实
      # tag（vX.Y.Z），手动构建用 dev-<sha前7位> 以区分是哪次构建。
      # Windows runner 默认 shell 是 pwsh，${VAR:0:7} 参数展开只在 bash 有，
      # 显式指定 shell。
      - name: Build executable
        shell: bash
        # 事件值只进环境变量、不内联进脚本文本——防止 tag 名被当 shell 代码解析
        # （git ref 允许 ; $ 反引号）
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$TAG_NAME"
          else
            TAG="dev-${GITHUB_SHA:0:7}"
          fi
          uv run python scripts/build.py --tag "$TAG"

      # 冒烟：解压归档跑 --version/--help/--completion、断言执行位
      # （等价于本地 python3 scripts/smoke.py --scripts）；不通过则后续步骤不会执行
      # --scripts: Windows 腿额外真跑 install→uninstall 往返（PATH 快照→写入→移除→逐字还原）
      - name: Smoke test archive
        run: uv run python scripts/smoke.py --scripts

      # artifact 必然是"zip 套一层"：upload-artifact 的存储格式就是 zip，
      # 无法绕过。内层保持 build.py 的 tar.gz/zip 是刻意的——v4 不保留文件
      # 权限，直接传文件夹会丢 install.sh 执行位；实测外层 deflate 还能把
      # gzip 流再挤小 ~1%。正式用户走 Release 附件（单层），这里只是测试通道。
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdpm-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.suffix || 'default' }}
          path: dist/gdpm_*

  # 汇总作业：下载四条腿的全部产物，统一生成 sha256 校验清单
  checksums:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 下载产物 + sha256sum，正常秒级
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -name "gdpm_*" -exec sha256sum {} \; > ../checksums.txt
          cd ..
          cat checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.txt

  # 发布作业：把归档 + 校验清单挂到 Release 资产。
  # 仅 release 事件（手动 dispatch 只留 artifact 供检查，不发附件）。
  upload:
    needs: [build, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 下载产物 + 挂 Release 附件，正常秒级
    if: github.event_name == 'release'
    permissions:
      contents: write # 挂 Release 附件（job 级覆盖 workflow 级的 read）
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/gdpm_*
            artifacts/checksums/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
