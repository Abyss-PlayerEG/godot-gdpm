name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync

      - name: Run mypy
        run: python3 scripts/check.py mypy

      - name: Run ruff
        run: python3 scripts/check.py ruff

      - name: Run format
        run: python3 scripts/check.py format

      - name: Run pylint
        run: python3 scripts/check.py pylint

      - name: Run vulture
        run: python3 scripts/check.py vulture

      - name: Run deptry
        run: python3 scripts/check.py deptry

      - name: Run tests
        run: python3 scripts/check.py test
