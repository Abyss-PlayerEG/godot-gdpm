name: Question (English)
description: Ask a question about using gdpm.
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [documentation](https://github.com/Abyss-PlayerEG/godot-gdpm/tree/main/docs) first.

        **中文用户**：请改用 [提问（中文）](?template=3_question_zh.yml)。

  - type: textarea
    attributes:
      label: Question
      description: Describe your question in detail.
    validations:
      required: true

  - type: input
    attributes:
      label: Platform
      description: "Operating system and architecture (on macOS/Linux: `uname -orsm`)."
      placeholder: e.g., Windows 11 x86_64, macOS 14 arm64, Ubuntu 24.04 amd64
    validations:
      required: false

  - type: input
    attributes:
      label: Version
      description: Paste the output of `gdpm --version`.
      placeholder: e.g., gdpm v0.1.0a1 (binary | Windows x86_64)
    validations:
      required: false
