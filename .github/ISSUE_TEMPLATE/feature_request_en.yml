name: Feature request
description: Suggest a new command, option, or workflow.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **中文用户**：请改用 [功能建议（中文）](?template=feature_request_zh.yml)。

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow pain, not just the proposed command.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Command name, flags, expected output — a rough sketch is enough.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI core (add / sync / lock / list / ...)
        - Godot engine management
        - Installer / packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing commands or workarounds you tried.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, screenshots, examples from other package managers.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
