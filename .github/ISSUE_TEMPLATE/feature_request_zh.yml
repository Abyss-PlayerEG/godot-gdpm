name: 功能建议（中文）
description: 建议新的命令、选项或工作流。
title: "[Feature/中文] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **English users**: please use [Feature request (English)](?template=feature_request_en.yml).

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 请描述工作流中的痛点，而不只是一个命令名。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 命令名、参数、输出示例——粗略草图即可。
      render: shell
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 所属模块
      options:
        - CLI 核心（add / sync / lock / list / ...）
        - Godot 引擎管理
        - 安装器 / 打包
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 已尝试的现有命令或绕过方式。

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 链接、截图、其他包管理器的类似实现。

  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我已搜索现有 Issue，确认不是重复建议。
          required: true
